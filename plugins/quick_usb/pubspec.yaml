name: quick_usb
description: A cross-platform USB plugin for Flutter
version: 0.3.1
homepage: https://github.com/woodemi/quick_usb

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.0
  libusb: ^0.3.23-nullsafety.0
  ffi: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.quick_usb
        pluginClass: QuickUsbPlugin
      windows:
        pluginClass: QuickUsbPlugin
      macos:
        pluginClass: QuickUsbPlugin
      linux:
        pluginClass: QuickUsbPlugin
